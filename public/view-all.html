<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Real Photos</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .card { background: #222; border-radius: 8px; overflow: hidden; padding: 10px; }
    img { width: 100%; height: 220px; object-fit: cover; border-radius: 6px; }
    h3 { margin: 10px 0 5px; font-size: 16px; color: #e5b869; }
  </style>
</head>
<body>
  <h1>Morni Real Assets Viewer</h1>
  <div class="grid" id="grid"></div>
  <script>
    const images = [
      "56931.png", "56960.png", "56969.png", "56971.png", "56973.png", 
      "56974.png", "57001.png", "57006.png", "57010.png", "57011.png", 
      "57012.png", "57014.png", "57028.png", "57029.png", "57047.png", 
      "57052.png", "57054.png", "57055.png", "57056.png", "57058.png", 
      "57066.png", "57070.png", "57071.png"
    ];
    const grid = document.getElementById("grid");
    images.forEach(name => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <img src="/images/morni/${name}" alt="${name}" loading="lazy" />
        <h3>${name}</h3>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
