<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Luxury Dark Base for Contrast on both Dark & Light Browser Themes -->
  <rect width="64" height="64" rx="14" fill="#0C1811"/>
  
  <!-- Subtle Gold Border -->
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#E5B869" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Orange Semicircle Arch -->
  <path d="M 12 43 A 20 20 0 0 1 52 43 Z" fill="#EA580C" stroke="#0C1811" stroke-width="1.2"/>

  <!-- Cottage Body -->
  <rect x="23" y="32" width="18" height="11" rx="1" fill="#0C1811"/>
  <!-- Chimney -->
  <rect x="25" y="27" width="3.5" height="6" fill="#0C1811"/>
  <!-- Cottage Roof Triangle -->
  <path d="M 20 33 L 32 23 L 44 33 Z" fill="#1C382A" stroke="#FAF8F5" stroke-width="1" stroke-linejoin="round"/>
  <!-- Cottage Door -->
  <rect x="29" y="37" width="6" height="6" fill="#FAF8F5"/>

  <!-- 3 Sprouting Green Leaves -->
  <!-- Left leaf -->
  <path d="M 38 27 C 36 21 41 18 44 20 C 45 23 41 28 38 27 Z" fill="#22C55E" stroke="#FAF8F5" stroke-width="0.8"/>
  <!-- Center top leaf -->
  <path d="M 42 30 C 41 24 47 21 50 24 C 51 27 46 32 42 30 Z" fill="#16A34A" stroke="#FAF8F5" stroke-width="0.8"/>
  <!-- Lower leaf -->
  <path d="M 41 35 C 41 30 47 29 49 32 C 49 35 45 38 41 35 Z" fill="#4ADE80" stroke="#FAF8F5" stroke-width="0.8"/>

  <!-- Orange Plaque Banner -->
  <rect x="6" y="42" width="52" height="11" rx="2.5" fill="#C2410C" stroke="#0C1811" stroke-width="1"/>
  <!-- Brand Text in Banner -->
  <text x="32" y="50" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="5.2" letter-spacing="0.4">MORNI SINGH'S</text>
  
  <!-- Subtitle -->
  <text x="32" y="59" text-anchor="middle" fill="#E5B869" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="3.8" letter-spacing="0.8">MORNI HILLS</text>
</svg>